name: "Require a migration guide"
description: "Fail a pull request that adds a breaking changefile without touching a migration guide, unless it opts out via a checkbox in its description"

# Though the `.hark/migration-guides/` directory isn't read by `hark` directly, this seemed like the best home for this check.
# Basically, if you write a breaking changefile, you should also edit a migration guide file
# The openapi bot is exempt from this check, since it routinely adds breaking changes and the migration guide is covered elsewhere
# Only pull requests into a branch that eventually hits `master` need a guide, since that's the only branch we release GA versions from
#
# Run this on `pull_request` with `edited` added to the default event types, so that
# toggling the opt-out box re-runs the check:
#
#   on:
#     pull_request:
#       types: [opened, synchronize, reopened, edited]

outputs:
  skipped:
    description: "'true' when the pull request opted out of the check"
    value: ${{ steps.opt-out.outputs.skipped }}

runs:
  using: "composite"
  steps:
    - id: opt-out
      uses: $/actions/opt-out-checkbox
      with:
        checkbox: skip-migration-guide

    - name: Require a migration guide for breaking changes
      if: steps.opt-out.outputs.skipped != 'true'
      shell: bash
      run: |
        set -euo pipefail

        set -f
        for branch in $GUARDED_BASE_BRANCHES; do
          if [ "$BASE_BRANCH" = "$branch" ]; then
            guarded=1
            break
          fi
        done

        if [ -z "${guarded:-}" ]; then
          echo "${BASE_BRANCH} isn't a branch a major release is cut from; no migration guide needed."
          exit 0
        fi

        for exempt in $EXEMPT_AUTHORS; do
          if [ "$PR_AUTHOR" = "$exempt" ]; then
            echo "${PR_AUTHOR} is exempt from this check."
            exit 0
          fi
        done
        set +f

        FILES="${RUNNER_TEMP}/pr-files.json"
        gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}/files" --paginate >"$FILES"

        added=$(jq -r '.[] | select(.status == "added") | .filename' "$FILES" |
          grep -E '^\.hark/changes/[^/]+\.change\.md$' || true)

        # Any file under the directory counts, at any depth, whether it was added
        # or edited
        guides=$(jq -r '.[]
            | select(.status == "added" or .status == "modified"
                     or .status == "changed" or .status == "renamed")
            | .filename' "$FILES" |
          grep -E '^\.hark/migration-guides/.+' || true)

        # Only pending changefiles with an explicit `semver_level: major` need a guide.
        # Released changefiles may be added while adopting Hark or recovering history.
        breaking=""
        while IFS= read -r path; do
          [ -n "$path" ] || continue
          if [ ! -f "$path" ]; then
            echo "::error::${path} is listed as added but is not in the checkout. This action needs actions/checkout to run first."
            exit 1
          fi
          if awk '
                { sub(/\r$/, "") }
                NR == 1 { if ($0 != "---") exit 1; infm = 1; next }
                infm && $0 == "---" { infm = 0; next }
                infm && /^semver_level:/ {
                  v = $0
                  sub(/^semver_level:[ \t]*/, "", v)
                  sub(/[ \t]*$/, "", v)
                  gsub(/^["'\'']|["'\'']$/, "", v)
                  if (v == "major") found = 1
                }
                infm && /^released_in_version:/ { released = 1 }
                END { exit found && !released ? 0 : 1 }
              ' "$path"; then
            breaking="${breaking}${path}"$'\n'
          fi
        done <<<"$added"

        if [ -z "$breaking" ]; then
          # The files endpoint stops at 3000 entries, so we can't be sure if a big PR has one
          # We'll fail and leave it up to the reviewer to confirm
          if [ "${CHANGED_FILES:-0}" -ge 3000 ]; then
            echo "::error::This pull request touches ${CHANGED_FILES} files and GitHub only reports the first 3000, so this check cannot tell whether it adds a breaking changefile. Merge through this failure if needed."
            exit 1
          fi
          echo "no breaking changefiles added; no migration guide needed."
          exit 0
        fi

        echo "this pull request adds breaking changefiles:"
        while IFS= read -r path; do
          [ -n "$path" ] && echo "  ${path}"
        done <<<"$breaking"

        if [ -n "$guides" ]; then
          echo "and touches:"
          while IFS= read -r path; do
            echo "  ${path}"
          done <<<"$guides"
          exit 0
        fi

        TRUNCATED=""
        if [ "${CHANGED_FILES:-0}" -ge 3000 ]; then
          TRUNCATED=" (this pull request touches ${CHANGED_FILES} files and GitHub only reports the first 3000, so a guide may have been missed)"
        fi

        echo "::error::This pull request adds a breaking changefile but touches nothing in .hark/migration-guides/${TRUNCATED}. Please add upgrade instructions for users, or check the \`skip-migration-guide\` box in the description if no migration guide is needed."
        exit 1
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        # Whitespace-separated logins
        EXEMPT_AUTHORS: "stripe-openapi[bot]"
        # Whitespace-separated branch names; a pull request into anything else is exempt
        GUARDED_BASE_BRANCHES: "master sdk-release/next-major"
