name: "hark checks"
description: "Run all the changelog-specific validation a PR might need"

# One-stop shop for changelog validations.
#
# The calling job has to provide:
#
#   permissions:
#     contents: read       # for the checkout the last two steps read changefiles from
#     pull-requests: read  # to ask which files the pull request touches
#   steps:
#     - uses: actions/checkout@...
#
# and the workflow has to add `edited` to the default pull_request event types, so that
# toggling an opt-out box re-runs the checks:
#
#   on:
#     pull_request:
#       types: [opened, synchronize, reopened, edited]
#
# Neither can be declared here: a composite action cannot grant its own permissions or
# declare its own triggers.

inputs:
  path:
    description: "The repo's hark directory, relative to the repo root"
    default: ".hark"
  working-directory:
    description: "Directory to run `hark validate` in, relative to the repo root"
    default: "."

runs:
  using: "composite"
  steps:
    # Ordered cheapest to most expensive
    - uses: $/actions/require-changefile
      with:
        path: ${{ inputs.path }}/changes
    - uses: $/actions/require-migration-guide
      with:
        path: ${{ inputs.path }}
    - uses: $/actions/validate-changefiles
      with:
        working-directory: ${{ inputs.working-directory }}
