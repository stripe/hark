name: "Validate changefiles"
description: "Run `hark validate` over every changefile in the repository. Needs the repo checked out already."

inputs:
  working-directory:
    description: "Directory to run `hark validate` in, relative to the repo root"
    default: "."

runs:
  using: "composite"
  steps:
    - uses: $/actions/setup-hark

    - name: Validate changefiles
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: hark validate # looks for the `.hark` directory under the working directory
