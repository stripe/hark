name: "Require a changefile"
description: "Fail a pull request that adds no changefile, unless it opts out of this check via a checkbox in its description"

# Run this on `pull_request` with `edited` added to the default event types, so that
# toggling the opt-out box re-runs the check:
#
#   on:
#     pull_request:
#       types: [opened, synchronize, reopened, edited]

outputs:
  skipped:
    description: "'true' when the pull request opted out of the check"
    value: ${{ steps.opt-out.outputs.skipped }}

runs:
  using: "composite"
  steps:
    - id: opt-out
      uses: $/actions/opt-out-checkbox
      with:
        checkbox: skip-changefile

    - name: Look for an added changefile
      if: steps.opt-out.outputs.skipped != 'true'
      shell: bash
      run: |
        set -euo pipefail

        # Lists the changefiles in one commit, from the API rather than a checkout. The trees
        # endpoint takes a `<sha>:<path>`, so this is a single request no matter how many
        # files the pull request touches.
        #
        # Nested directories are `tree` entries rather than `blob`s, so they're skipped along
        # with anything inside them: a changefile is only read at the top of `.hark/changes`.
        changefiles() {
          local out
          if ! out=$(gh api "repos/${GH_REPO}/git/trees/${1}:.hark/changes" \
              --jq '.tree[] | select(.type == "blob") | .path' 2>&1); then
            # A branch without the directory (the first changefile ever, or a fork of a repo
            # that predates hark) has no changefiles in it, which is not an error.
            case "$out" in
              *"Not Found"*) return 0 ;;
              *) echo "::error::could not list .hark/changes at ${1}: ${out}"; return 1 ;;
            esac
          fi
          printf '%s\n' "$out"
        }

        base_files=$(changefiles "$BASE_SHA" | sort)
        head_files=$(changefiles "$HEAD_SHA" | sort)

        # Only what this pull request brought: present at its head, absent from its base.
        added=$(comm -13 <(printf '%s\n' "$base_files") <(printf '%s\n' "$head_files") |
          grep -E '\.change\.md$' || true)

        if [ -n "$added" ]; then
          echo "this pull request adds:"
          while IFS= read -r path; do
            echo "  .hark/changes/${path}"
          done <<<"$added"
          exit 0
        fi

        echo "::error::This pull request adds no changefile. Run \`hark new\` to write one, or check the \`skip-changefile\` box in the description if this isn't a user-facing change."
        exit 1
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
