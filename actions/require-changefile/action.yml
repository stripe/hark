name: "Require a changefile"
description: "Fail a pull request that adds no changefile, unless it opts out of this check via a checkbox in its description"

# Run this on `pull_request` with `edited` added to the default event types, so that
# toggling the opt-out box re-runs the check:
#
#   on:
#     pull_request:
#       types: [opened, synchronize, reopened, edited]

outputs:
  skipped:
    description: "'true' when the pull request opted out of the check"
    value: ${{ steps.opt-out.outputs.skipped }}

runs:
  using: "composite"
  steps:
    - id: opt-out
      uses: $/actions/opt-out-checkbox
      with:
        checkbox: skip-changefile

    - name: Look for an added changefile
      if: steps.opt-out.outputs.skipped != 'true'
      shell: bash
      run: |
        set -euo pipefail

        # Gets the changed file list from the API rather than a checkout, which is faster.
        added=$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}/files" --paginate \
          --jq '.[] | select(.status == "added") | .filename' |
          grep -E '^\.hark/changes/[^/]+\.change\.md$' || true)

        if [ -n "$added" ]; then
          echo "this pull request adds:"
          while IFS= read -r path; do
            echo "  ${path}"
          done <<<"$added"
          exit 0
        fi

        # The files endpoint stops at 3000 entries, so we can't be sure if a big PR has one
        # We'll fail and leave it up to the reviewer to confirm
        if [ "${CHANGED_FILES:-0}" -ge 3000 ]; then
          echo "::error::This pull request touches ${CHANGED_FILES} files and GitHub only reports the first 3000, so this check cannot tell whether it adds a changefile. Check the \`skip-changefile\` box if you have one (honor system)."
          exit 1
        fi

        echo "::error::This pull request adds no changefile. Run \`hark new\` to write one, or check the \`skip-changefile\` box in the description if this isn't a user-facing change."
        exit 1
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
