name: "Check github links"
description: "Fail a pull request whose changefiles point to GH objects in another repository"

# Changefile metadata should only be able to reference issues & PRs in their own repo. The bodies of changefiles can reference anything.

runs:
  using: "composite"
  steps:
    - name: Check that every touched changefile only has references to this repo
      shell: bash
      run: |
        set -euo pipefail

        FILES="${RUNNER_TEMP}/pr-files.json"
        gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}/files" --paginate >"$FILES"

        changefiles=$(jq -r '.[]
            | select(.status == "added" or .status == "modified"
                     or .status == "changed" or .status == "renamed")
            | .filename' "$FILES" |
          grep -E '^\.hark/changes/[^/]+\.change\.md$' || true)

        wrong=""
        while IFS= read -r path; do
          [ -n "$path" ] || continue
          if [ ! -f "$path" ]; then
            echo "::error::${path} is listed as changed but is not in the checkout. This action needs actions/checkout to run first."
            exit 1
          fi

          # Collect the link-valued frontmatter fields, emitting a field name and a URL
          # per line for the loop below to split on.
          links=$(awk -v OFS='\t' '
                { sub(/\r$/, "") }
                NR == 1 { if ($0 != "---") exit; infm = 1; next }
                infm && $0 == "---" { exit }
                !infm { next }
                # A list item belongs to whichever field opened the list.
                /^[ \t]*-[ \t]+/ {
                  if (field != "") {
                    v = $0
                    sub(/^[ \t]*-[ \t]*/, "", v)
                    gsub(/^"|"$/, "", v)
                    if (v != "") print field "[" idx "]", v
                    idx++
                  }
                  next
                }
                /^pr_url:/ {
                  v = $0
                  sub(/^pr_url:[ \t]*/, "", v)
                  gsub(/^"|"$/, "", v)
                  if (v != "") print "pr_url", v
                  field = ""
                  next
                }
                /^github_issues_resolved:/ { field = "github_issues_resolved"; idx = 0; next }
                # Any other key at the left margin closes an open list.
                /^[^ \t#]/ { field = "" ; next }
              ' "$path")

          # No links at all is fine: both fields are optional
          [ -n "$links" ] || continue

          while IFS=$'\t' read -r field url; do
            [ -n "$url" ] || continue

            repo=$(printf '%s' "$url" |
              grep -oE '^https?://github\.com/[^/]+/[^/]+' |
              grep -oE '[^/]+/[^/]+$' || true)

            # Something that is not a GitHub URL is `hark validate`'s to complain
            # about, not this check's.
            [ -n "$repo" ] || continue

            if [ "$repo" != "$GH_REPO" ]; then
              wrong="${wrong}  ${path} (${field}): cites ${repo}"$'\n'
            fi
          done <<<"$links"
        done <<<"$changefiles"

        if [ -z "$wrong" ]; then
          echo "every changefile this pull request touches cites ${GH_REPO}."
          exit 0
        fi

        printf '%s' "$wrong"
        echo "::error::The metadata in the above changefiles reference a github repo besides this one (${GH_REPO})."
        exit 1
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
